name: Smoke SDTM

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Permissions needed for GitHub Pages deployment and PR comments
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # install package for CLI entrypoint
          pip install -e .

      - name: Run smoke test
        run: |
          mkdir -p output/smoke
          bash scripts/smoke_sdtm.sh

      - name: Upload smoke outputs (per Python)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output-py${{ matrix.python-version }}
          path: |
            output/smoke/**
            output/*.csv
            output/*.dataset.json

  smoke-aggregate:
    name: Aggregate Smoke Artifacts
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Download all smoke artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: smoke-output-py*
          path: combined-smoke
          merge-multiple: true
      - name: Re-upload unified smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: combined-smoke

  diff-report:
    name: USDM Diff Report
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate diff artifacts (with fail detection)
        id: generate_diff
        run: |
          mkdir -p output/diff
          DIFF_EXIT=0
          # Summary with fail-on-change; capture exit code instead of aborting pipeline immediately
          usdm-utils diff files/pilot_LLZT_amendment_10SEP25.json files/pilot_LLZT_amendment_11SEP25.json \
            --objects-only --summary-only --json --fail-on-change > output/diff/summary.json || DIFF_EXIT=$?
          # Full objects-only JSON diff (non-gating)
          usdm-utils diff files/pilot_LLZT_amendment_10SEP25.json files/pilot_LLZT_amendment_11SEP25.json \
            --objects-only --json > output/diff/objects.json || true
          # HTML report
          usdm-utils diff-html files/pilot_LLZT_amendment_10SEP25.json files/pilot_LLZT_amendment_11SEP25.json \
            --output output/diff/objects.html --list-key id || true
          # Expose flag for subsequent steps
          if [ "$DIFF_EXIT" -ne 0 ]; then echo "changes=1" >> $GITHUB_OUTPUT; else echo "changes=0" >> $GITHUB_OUTPUT; fi

      - name: Prepare Pages content
        run: |
          mkdir -p site
          body_file="output/diff/objects.html"
          summary_file="output/diff/summary.json"
          total=0 added=0 removed=0 changed=0
          if [ -f "$summary_file" ]; then \
            total=$(jq -r '.summary.total // 0' "$summary_file" 2>/dev/null || echo 0); \
            added=$(jq -r '.summary.added // 0' "$summary_file" 2>/dev/null || echo 0); \
            removed=$(jq -r '.summary.removed // 0' "$summary_file" 2>/dev/null || echo 0); \
            changed=$(jq -r '.summary.changed // 0' "$summary_file" 2>/dev/null || echo 0); \
          fi
          echo "<!DOCTYPE html><html><head><meta charset='utf-8'><title>USDM Diff</title><style>body{font-family:system-ui,Arial,sans-serif;margin:0;padding:0 0 2rem;}header{background:#0d1117;color:#fff;padding:.75rem 1rem;margin:0 0 1rem;font-size:14px;}main{padding:0 1rem;}iframe{border:0;width:100%;min-height:80vh;}</style></head><body>" > site/index.html
          echo "<header>USDM Diff – Objects changed: ${total} (added ${added}, removed ${removed}, changed ${changed})</header>" >> site/index.html
          echo "<main>" >> site/index.html
          if [ -f "$body_file" ]; then \
            # Strip existing DOCTYPE/HTML wrappers if present
            sed -e '1,/<body>/d' -e '/<\/body>.*/,$d' "$body_file" >> site/index.html || cat "$body_file" >> site/index.html; \
          else \
            echo "<p>No diff HTML generated.</p>" >> site/index.html; \
          fi
          echo "</main></body></html>" >> site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        if: ${{ github.event_name != 'pull_request' }}

      - name: Deploy to GitHub Pages (PR preview)
        id: deploy_pr
        uses: actions/deploy-pages@v4
        if: ${{ github.event_name == 'pull_request' }}

      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdm-diff-artifacts
          path: |
            output/diff/summary.json
            output/diff/objects.json
            output/diff/objects.html

      - name: Post PR comment (diff summary + live link)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'output/diff/summary.json';
            let summaryData = { summary: {} };
            if (fs.existsSync(path)) {
              try { summaryData = JSON.parse(fs.readFileSync(path,'utf8')); } catch(e) { core.warning('Could not parse summary.json'); }
            }
            const s = summaryData.summary || {};
            // Pages preview URL is exposed via deployment outputs (see docs); fallback to standard pattern
            const pagesUrl = process.env.GITHUB_PAGES_URL || `https://${process.env.GITHUB_REPOSITORY_OWNER}.github.io/${process.env.GITHUB_REPOSITORY.split('/')[1]}`;
            const body = [
              '### USDM Diff Summary',
              '',
              `Objects changed: **${s.total ?? 0}** (added ${s.added ?? 0}, removed ${s.removed ?? 0}, changed ${s.changed ?? 0})`,
              '',
              `Live HTML diff: ${pagesUrl}`,
              '',
              'Artifacts: download workflow artifact `usdm-diff-artifacts` (contains raw JSON & HTML).'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail if differences detected
        if: steps.generate_diff.outputs.changes == '1'
        run: |
          echo 'USDM differences detected (see artifacts for details). Failing job.'
          exit 1

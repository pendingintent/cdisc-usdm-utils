name: USDM Diff Artifacts

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  smoke-lite:
    name: Smoke SDTM (lite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run smoke script
        run: |
          mkdir -p output/smoke
          bash scripts/smoke_sdtm.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-lite-artifacts
          path: |
            output/smoke/**
            output/*.csv
            output/*.dataset.json

  diff-report:
    name: USDM Diff Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Generate diff artifacts (with fail detection)
        id: generate_diff
        run: |
          mkdir -p output/diff
          DIFF_EXIT=0
          # Summary with fail-on-change; capture exit code instead of aborting pipeline immediately
          usdm-utils diff files/pilot_LLZT_amendment_10SEP25.json files/pilot_LLZT_amendment_11SEP25.json \
            --objects-only --summary-only --json --fail-on-change > output/diff/summary.json || DIFF_EXIT=$?
          # Full objects-only JSON diff (non-gating)
          usdm-utils diff files/pilot_LLZT_amendment_10SEP25.json files/pilot_LLZT_amendment_11SEP25.json \
            --objects-only --json > output/diff/objects.json || true
          # HTML report
          usdm-utils diff-html files/pilot_LLZT_amendment_10SEP25.json files/pilot_LLZT_amendment_11SEP25.json \
            --output output/diff/objects.html --list-key id || true
          # Expose flag for subsequent steps
          if [ "$DIFF_EXIT" -ne 0 ]; then echo "changes=1" >> $GITHUB_OUTPUT; else echo "changes=0" >> $GITHUB_OUTPUT; fi


      - name: Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdm-diff-artifacts
          path: |
            output/diff/summary.json
            output/diff/objects.json
            output/diff/objects.html

      - name: Post PR comment (diff summary)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'output/diff/summary.json';
            let summaryData = { summary: {} };
            if (fs.existsSync(path)) {
              try { summaryData = JSON.parse(fs.readFileSync(path,'utf8')); } catch(e) { core.warning('Could not parse summary.json'); }
            }
            const s = summaryData.summary || {};
            const body = [
              '### USDM Diff Summary',
              '',
              `Objects changed: **${s.total ?? 0}** (added ${s.added ?? 0}, removed ${s.removed ?? 0}, changed ${s.changed ?? 0})`,
              '',
              'Artifacts: download workflow artifact `usdm-diff-artifacts` (raw JSON & HTML).'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      # No failing step; always succeed while still surfacing diff artifacts.
